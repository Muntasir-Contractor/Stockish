name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'Dockerfile'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Stockish
            git pull origin main
            docker build -t stockish-api .
            docker stop stockish-api && docker rm stockish-api
            docker run -d --name stockish-api --restart unless-stopped --env-file backend/.env -p 8000:8000 stockish-api
