name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify instance is reachable
        run: |
          STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --query "InstanceInformationList[0].PingStatus" \
            --output text)
          if [ "$STATUS" != "Online" ]; then
            echo "EC2 instance SSM agent is not online (status: $STATUS)"
            exit 1
          fi

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 900 \
            --parameters 'commands=[
              "set -e",
              "export HOME=/root",
              "git config --global --add safe.directory /home/ubuntu/Stockish",
              "cd /home/ubuntu/Stockish",
              "git pull origin main",
              "docker system prune -f",
              "docker build -t stockish-api .",
              "docker stop stockish-api || true",
              "docker rm stockish-api || true",
              "docker run -d --name stockish-api --restart unless-stopped --env-file backend/.env -p 8000:8000 stockish-api",
              "sleep 5",
              "docker ps --filter name=stockish-api --filter status=running | grep -q stockish-api && echo Deploy healthy || (echo Container not running && exit 1)"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            if [ "$STATUS" != "InProgress" ] && [ "$STATUS" != "Pending" ]; then
              break
            fi
            echo "Waiting for deploy... ($i/60)"
            sleep 10
          done

          echo "=== Deploy Output ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

          echo "=== Deploy Errors ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardErrorContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi
